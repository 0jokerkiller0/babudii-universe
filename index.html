<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Babudii ✦ A Universe for You</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Cinzel:wght@500&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--gold:#ffcc66;--rose:#ff8fab;--ink:#fff3dc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);overflow:hidden;font-family:'Cormorant Garamond',Georgia,serif;-webkit-tap-highlight-color:transparent;user-select:none}
#neb{position:fixed;inset:-15%;opacity:0;transition:opacity 7s;background:
radial-gradient(40% 35% at 25% 30%,rgba(130,70,220,.30),transparent 70%),
radial-gradient(45% 40% at 78% 70%,rgba(255,100,150,.20),transparent 70%),
radial-gradient(35% 30% at 55% 20%,rgba(255,190,90,.12),transparent 70%),
radial-gradient(60% 50% at 50% 100%,rgba(60,40,140,.35),transparent 70%);animation:dr 50s ease-in-out infinite alternate}
#neb.on{opacity:1}
@keyframes dr{to{transform:scale(1.15) rotate(6deg)}}
canvas{position:fixed;inset:0;width:100%;height:100%}
#w{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:clamp(20px,5vw,30px);font-style:italic;color:#ffe3b0;opacity:0;animation:wh 5s 1.2s ease-in-out forwards;pointer-events:none}
@keyframes wh{0%,100%{opacity:0}30%,70%{opacity:.9}}
#pf{position:fixed;opacity:0;transform:scale(.96);transition:opacity 1.8s,transform 1.8s;border-radius:16px;overflow:hidden;border:1px solid rgba(255,204,102,.55);box-shadow:0 0 50px rgba(255,160,120,.35),0 0 120px rgba(183,148,246,.25);pointer-events:none}
#pf.on{opacity:1;transform:scale(1)}
#pf img{width:100%;height:100%;object-fit:cover;display:block}
#card{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);width:min(92vw,460px);padding:18px 22px;border-radius:24px;text-align:center;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,204,102,.3);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 60px rgba(255,120,160,.18);opacity:0;transition:opacity .9s,transform .9s;pointer-events:none}
#card.on{opacity:1;transform:translate(-50%,0)}
.lab{font-family:Cinzel,Georgia,serif;font-size:11px;letter-spacing:4px;color:var(--gold);margin-bottom:8px}
.q{font-size:clamp(20px,5.2vw,25px);line-height:1.3;font-style:italic;font-weight:500;min-height:2.6em}
.tap{margin-top:10px;font-size:12px;letter-spacing:2px;color:var(--rose);animation:pl 2s infinite}
@keyframes pl{50%{opacity:.35}}
#mu{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,204,102,.4);background:rgba(255,255,255,.08);color:#fff;font-size:17px;z-index:5}
</style></head><body>
<div id="neb"></div>
<canvas id="c"></canvas>
<div id="pf"><img id="pi" alt=""></div>
<div id="w">somewhere in the universe…</div>
<button id="mu" aria-label="music">🔊</button>
<div id="card"><div class="lab" id="lab"></div><div class="q" id="q"></div><div class="tap" id="tap">TAP TO CONTINUE ✦</div></div>

// music box
let AC,mg,mute=false,step=0;
function music(){if(AC){if(AC.state==='suspended')AC.resume();return}
 AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.55;const dl=AC.createDelay(),fb=AC.createGain();dl.delayTime.value=.42;fb.gain.value=.42;dl.connect(fb);fb.connect(dl);mg.connect(AC.destination);mg.connect(dl);dl.connect(mg);
 const R=[0,-3,-7,-5],A=[0,4,7,12,7,4];
 setInterval(()=>{if(AC.state!=='running')return;const n=R[(step/6|0)%4]+A[step%6]+12,f=261.63*Math.pow(2,n/12),t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1.8);o.connect(g);g.connect(mg);o.start(t);o.stop(t+1.9);step++},430)}
const mu=document.getElementById('mu');
mu.addEventListener('pointerdown',e=>{e.stopPropagation();music();mute=!mute;mg.gain.value=mute?0:.55;mu.textContent=mute?'🔇':'🔊'});

function frame(now){
 const t=(now-T0)/1000;x.globalCompositeOperation='source-over';x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
 for(const p of P){const age=t-p.b;if(age<0)continue;
  if(!p.init){p.x=p.hx*W;p.y=p.hy*H;p.init=1}
  let dx,dy;if(p.has){dx=p.tx+Math.sin(t*1.4+p.ph)*1.2*D;dy=p.ty+Math.cos(t*1.2+p.ph)*1.2*D}else{dx=p.hx*W+Math.sin(t*.25+p.ph)*16*D;dy=p.hy*H+Math.cos(t*.2+p.ph*1.3)*16*D}
  const k=p.has?.013:.004;p.vx+=(dx-p.x)*k;p.vy+=(dy-p.y)*k;
  const rx=p.x-ptr.x,ry=p.y-ptr.y,rd=rx*rx+ry*ry,R=110*D;if(rd<R*R&&rd>1){const f=(1-Math.sqrt(rd)/R)*2.2*D/Math.sqrt(rd);p.vx+=rx*f;p.vy+=ry*f}
  p.vx*=.87;p.vy*=.87;p.x+=p.vx;p.y+=p.vy;
  for(let j=0;j<3;j++)p.c[j]+=(p.tc[j]-p.c[j])*.04;
  const u=age/.7,sz=u<1?1+2.7*Math.pow(u-1,3)+1.7*Math.pow(u-1,2):1,fl=age<.5?1+(1-age/.5)*3:1;
  const a=Math.min(1,(p.has?.95:.3+.5*(.5+.5*Math.sin(t*2+p.ph)))*fl),r=p.r*D*sz*(p.has?1.15:1)*(1+(fl-1)*.6);
  const cs=`${p.c[0]|0},${p.c[1]|0},${p.c[2]|0}`;
  x.fillStyle=`rgba(${cs},${a})`;x.beginPath();x.arc(p.x,p.y,r,0,6.283);x.fill();
  if(GL&&(p.has||p.r>1.5||fl>1.5)){x.fillStyle=`rgba(${cs},${a*.16})`;x.beginPath();x.arc(p.x,p.y,r*3.4,0,6.283);x.fill()}}
 if(t>nextS&&!ss){ss={x:Math.random()*W*.8,y:Math.random()*H*.35,l:1};nextS=t+5+Math.random()*6}
 if(ss){ss.x+=9*D;ss.y+=4*D;ss.l-=.025;const gr=x.createLinearGradient(ss.x-110*D,ss.y-50*D,ss.x,ss.y);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(1,`rgba(255,235,200,${Math.max(ss.l,0)})`);x.strokeStyle=gr;x.lineWidth=2*D;x.beginPath();x.moveTo(ss.x-110*D,ss.y-50*D);x.lineTo(ss.x,ss.y);x.stroke();if(ss.l<=0)ss=null}
 const fin=sc===SC.length-1;
 if(fin){if(Math.random()<.05)boom(Math.random()*W,H*(.08+Math.random()*.35));if(Math.random()<.09)pet.push({x:Math.random()*W,y:-30*D,v:(1.2+Math.random()*1.8)*D,s:(14+Math.random()*20)*D,a:Math.random()*6,w:Math.random()*2})}
 for(const f of fw){f.l-=.012;f.x+=f.vx;f.y+=f.vy;f.vy+=.035*D;x.fillStyle=`rgba(${f.c},${Math.max(f.l,0)})`;x.beginPath();x.arc(f.x,f.y,2.4*D,0,6.283);x.fill()}
 fw=fw.filter(f=>f.l>0);
 x.globalCompositeOperation='source-over';x.textAlign='center';x.textBaseline='middle';
 for(const s of pet){s.y+=s.v;s.a+=.02;s.x+=Math.sin(s.a+s.w)*.8*D;x.save();x.translate(s.x,s.y);x.rotate(Math.sin(s.a)*.6);x.globalAlpha=.9;x.font=s.s+'px serif';x.fillText('🌻',0,0);x.restore()}
 pet=pet.filter(s=>s.y<H+40*D);
 requestAnimationFrame(frame)}
