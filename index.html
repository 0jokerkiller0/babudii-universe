<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Babudii ✦ A Universe for You</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Cinzel:wght@500&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--gold:#ffcc66;--rose:#ff8fab;--ink:#fff3dc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);overflow:hidden;font-family:'Cormorant Garamond',Georgia,serif;-webkit-tap-highlight-color:transparent;user-select:none}
#neb{position:fixed;inset:-15%;opacity:0;transition:opacity 7s;background:
radial-gradient(40% 35% at 25% 30%,rgba(130,70,220,.30),transparent 70%),
radial-gradient(45% 40% at 78% 70%,rgba(255,100,150,.20),transparent 70%),
radial-gradient(35% 30% at 55% 20%,rgba(255,190,90,.12),transparent 70%),
radial-gradient(60% 50% at 50% 100%,rgba(60,40,140,.35),transparent 70%);animation:dr 50s ease-in-out infinite alternate}
#neb.on{opacity:1}
@keyframes dr{to{transform:scale(1.15) rotate(6deg)}}
canvas{position:fixed;inset:0;width:100%;height:100%}
#w{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:clamp(20px,5vw,30px);font-style:italic;color:#ffe3b0;opacity:0;animation:wh 5s 1.2s ease-in-out forwards;pointer-events:none}
@keyframes wh{0%,100%{opacity:0}30%,70%{opacity:.9}}
#pf{position:fixed;opacity:0;transform:scale(.96);transition:opacity 1.8s,transform 1.8s;border-radius:16px;overflow:hidden;border:1px solid rgba(255,204,102,.55);box-shadow:0 0 50px rgba(255,160,120,.35),0 0 120px rgba(183,148,246,.25);pointer-events:none}
#pf.on{opacity:1;transform:scale(1)}
#pf img{width:100%;height:100%;object-fit:cover;display:block}
#card{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);width:min(92vw,460px);padding:18px 22px;border-radius:24px;text-align:center;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,204,102,.3);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 60px rgba(255,120,160,.18);opacity:0;transition:opacity .9s,transform .9s;pointer-events:none}
#card.on{opacity:1;transform:translate(-50%,0)}
.lab{font-family:Cinzel,Georgia,serif;font-size:11px;letter-spacing:4px;color:var(--gold);margin-bottom:8px}
.q{font-size:clamp(20px,5.2vw,25px);line-height:1.3;font-style:italic;font-weight:500;min-height:2.6em}
.tap{margin-top:10px;font-size:12px;letter-spacing:2px;color:var(--rose);animation:pl 2s infinite}
@keyframes pl{50%{opacity:.35}}
#mu{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,204,102,.4);background:rgba(255,255,255,.08);color:#fff;font-size:17px;z-index:5}
</style></head><body>
<div id="neb"></div>
<canvas id="c"></canvas>
<div id="pf"><img id="pi" alt=""></div>
<div id="w">somewhere in the universe…</div>
<button id="mu" aria-label="music">🔊</button>
<div id="card"><div class="lab" id="lab"></div><div class="q" id="q"></div><div class="tap" id="tap">TAP TO CONTINUE ✦</div></div>
